<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if (top === self) location.replace('admin.html#dokumentasi');</script>
<title>Dokumentasi</title>
<link rel="stylesheet" href="page-base.css">
<link rel="stylesheet" href="theme-light.css">
<script src="theme.js"></script>
<style>
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .card{
  border:1px solid rgba(128,128,128,.35);
  border-radius:10px;overflow:hidden;cursor:pointer;
  background:rgba(128,128,128,.12);   /* semi-transparan, ngikut tema */
  color:inherit;                       /* teks ngikut warna tema */
}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:rgba(128,128,128,.25)}
.card .m{padding:8px 10px;font-size:12px;line-height:1.4;color:inherit}
.card .m b{display:block;font-size:13px;color:inherit}
.card .m small{color:inherit;opacity:.7}
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:999;padding:16px;flex-direction:column;gap:10px}
  #lb.on{display:flex}
  #lb img{max-width:100%;max-height:78vh;border-radius:8px}
  #lb .cap{color:#fff;text-align:center;font-size:13px;max-width:700px}
  #lb a{color:#93c5fd;margin:0 8px}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<div id="lb"></div>
<script type="module">
import { guard, $, esc, toast, db, F } from './common.js';

guard(() => {
  const iso = d => d.toISOString().slice(0, 10);
  const today = new Date(), wk = new Date(Date.now() - 6 * 864e5);

  $('root').innerHTML = `
    <div class="page-header"><h1>Dokumentasi</h1><p>Foto kegiatan yang diambil user lewat Lapor Kegiatan.</p></div>
    <div class="panel">
      <div class="form" style="margin-bottom:16px">
        <label>Dari<input type="date" id="d1" value="${iso(wk)}"></label>
        <label>Sampai<input type="date" id="d2" value="${iso(today)}"></label>
        <label>User<select id="usr"><option value="">Semua</option></select></label>
        <label>Cari<input id="q" placeholder="Judul / catatan / lokasi..."></label>
        <label>&nbsp;<button class="btn ok" id="ref">Tampilkan</button></label>
      </div>
      <div id="info" style="color:var(--muted);margin-bottom:10px"></div>
      <div class="gal" id="gal"></div>
    </div>`;

  let all = [], view = [];
  const ms = d => d.createdAt || (d.createdAtServer?.seconds || 0) * 1000 || d.tanggalMillis || 0;
  const t = m => m ? new Date(m).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : (m || '-');

  const fillUsers = () => {
    const cur = $('usr').value, seen = new Map();
    all.forEach(d => d.userId && seen.set(d.userId, d.userName || d.userEmail || d.userId));
    $('usr').innerHTML = '<option value="">Semua</option>' +
      [...seen].map(([id, n]) => `<option value="${esc(id)}">${esc(n)}</option>`).join('');
    $('usr').value = seen.has(cur) ? cur : '';
  };

  const draw = () => {
    const u = $('usr').value, q = $('q').value.trim().toLowerCase();
    view = all.filter(d => (!u || d.userId === u) &&
      (!q || [d.judul, d.catatan, d.deskripsi, d.alamat, d.lokasi, d.userName].some(x => (x || '').toLowerCase().includes(q))))
      .sort((a, b) => ms(b) - ms(a));
    $('info').textContent = `${view.length} foto`;
    $('gal').innerHTML = view.map((d, i) => `
      <div class="card" data-i="${i}">
        <img src="${esc(d.fotoUrl)}" loading="lazy" alt="${esc(d.judul || 'foto')}">
        <div class="m"><b>${esc(d.judul || '(tanpa judul)')}</b>
          ${esc(d.userName || d.userEmail || '-')}<br>
          <small>${t(ms(d))}</small></div>
      </div>`).join('') || '<div class="empty">Tidak ada foto di rentang ini.</div>';
  };

  // One-time fetch, filter tanggal di server (field string "YYYY-MM-DD"), batas 300 doc
  const load = async () => {
    const a = $('d1').value, b = $('d2').value;
    if (!a || !b || a > b) return toast('Rentang tanggal tidak valid.', 'err');
    try {
      const snap = await F.getDocs(F.query(
        F.collection(db, 'lintas_kegiatan'),
        F.where('tanggal', '>=', a), F.where('tanggal', '<=', b),
        F.limit(300)));
      all = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(d => d.fotoUrl);
      if (snap.size >= 300) toast('Dibatasi 300 data, persempit rentang tanggal.', 'err');
      fillUsers(); draw();
    } catch (err) { toast('Gagal load: ' + (err.code || err.message), 'err'); }
  };

  const lb = $('lb');
  lb.onclick = e => { if (e.target.tagName !== 'A') lb.classList.remove('on'); };
  $('gal').onclick = e => {
    const c = e.target.closest('.card'); if (!c) return;
    const d = view[+c.dataset.i];
    lb.innerHTML = `<img src="${esc(d.fotoUrl)}" alt="">
      <div class="cap"><b>${esc(d.judul || '')}</b> · ${esc(d.userName || '')}<br>
        ${esc(d.catatan || d.deskripsi || '')}<br>
        <small>${t(ms(d))} · ${esc(d.alamat || d.lokasi || '')}</small><br>
        <a href="${esc(d.fotoUrl)}" target="_blank" rel="noopener">Buka asli</a>
        ${Number.isFinite(+d.lat) ? `<a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank" rel="noopener">Lokasi</a>` : ''}
      </div>`;
    lb.classList.add('on');
  };

  $('ref').onclick = load;
  $('usr').onchange = draw;
  $('q').oninput = draw;
  load();
});
</script>
</body>
</html>
