<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if (top === self) location.replace('admin.html#home');</script>
<title>Dashboard</title>
<link rel="stylesheet" href="page-base.css">
<link rel="stylesheet" href="theme-light.css">
<script src="theme.js"></script>
<style>
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.brk{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.brk .track{height:8px;border-radius:4px;background:rgba(128,128,128,.15);overflow:hidden}.brk .track i{display:block;height:100%;background:var(--blue)}
.feed li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid rgba(128,128,128,.15);font-size:13px}
.feed li:first-child{border-top:0}
</style>
</head>
<body>
<div class="page-header row"><div class="grow"><h1>Dashboard</h1><p id="sub">Memuat ringkasan…</p></div>
  <button class="btn" id="refresh">↻ Muat ulang</button></div>
<div id="stats"></div>
<div class="cols">
  <div class="panel"><h2>Status Kegiatan</h2><div id="keg"></div><h2 style="margin-top:18px">Status Laporan</h2><div id="lap"></div></div>
  <div class="panel"><h2>Aktivitas Terbaru</h2><ul class="feed" id="feed"></ul></div>
</div>
<div class="toast" id="toast"></div>
<script type="module">
import { guard, call, $, esc, LABEL, fmtTime, ago, errText, ready, stateBox } from './common.js';

guard(async (ctx) => {
  let timer = null, last = null;
  const card = (v, label, href, warn) => {
    const val = v === null || v === undefined ? '<div class="stat-value na">Tidak tersedia untuk peran ini</div>' : `<div class="stat-value">${v}</div>`;
    return `<a class="stat-card ${warn ? 'warn' : ''}" ${href ? `href="#" data-go="${href}"` : ''}>${val}<div class="stat-label">${label}</div></a>`;
  };
  const breakdown = (obj, labels) => {
    const total = Object.values(obj).reduce((a, b) => a + b, 0);
    if (!total) return '<div class="state">Belum ada data (0).</div>';
    return Object.entries(obj).map(([k, v]) => `<div class="brk"><span>${esc(labels[k])}</span><span class="track"><i style="width:${(v / total * 100).toFixed(1)}%"></i></span><b>${v}</b></div>`).join('');
  };

  async function load() {
    if (!last) stateBox($('stats'), 'loading', 'Memuat ringkasan…');
    $('refresh').disabled = true;
    try {
      const d = await call('dzDashboard');
      last = d;
      if (d.empty) {
        stateBox($('stats'), 'empty', 'Akun Anda belum memiliki lingkup unit. Minta administrator menetapkan unit.');
        $('keg').innerHTML = $('lap').innerHTML = $('feed').innerHTML = ''; return;
      }
      $('sub').textContent = `Diperbarui ${fmtTime(d.generatedAtMs, { seconds: true })} · lingkup: ${d.scope ? d.scope.length + ' unit' : 'semua unit'} · ambang lokasi ${d.staleMinutes} menit`;
      $('stats').innerHTML = '<div class="stat-grid">' + [
        card(d.personelAktif, 'Personel aktif'),
        card(d.kegiatan.berjalan, 'Kegiatan berjalan', 'kegiatan'),
        card(d.laporan.diajukan, 'Laporan menunggu pemeriksaan', 'laporan', d.laporan.diajukan > 0),
        card(d.sesiAktif, 'Sesi tracking aktif', 'tracking'),
        card(d.lokasiBelumDiperbarui, `Lokasi belum diperbarui (> ${d.staleMinutes} mnt)`, 'tracking', d.lokasiBelumDiperbarui > 0),
      ].join('') + '</div>';
      $('keg').innerHTML = breakdown(d.kegiatan, LABEL.kegiatan);
      $('lap').innerHTML = breakdown(d.laporan, LABEL.laporan);
      $('feed').innerHTML = d.aktivitas.length
        ? d.aktivitas.map((a) => `<li><span>${esc(a.ringkasan)}</span><small class="muted" title="${esc(fmtTime(a.atMs))}">${ago(a.atMs)}</small></li>`).join('')
        : '<li class="muted">Belum ada aktivitas tercatat.</li>';
    } catch (e) {
      stateBox($('stats'), 'err', 'Gagal mengambil ringkasan: ' + errText(e) + (last ? ' (menampilkan data terakhir di bawah)' : ''), load);
    } finally { $('refresh').disabled = false; ready(); }
  }
  $('refresh').onclick = load;
  document.addEventListener('click', (e) => { const a = e.target.closest('[data-go]'); if (a) { e.preventDefault(); top.navigate && top.navigate(a.dataset.go + '.html'); } });
  // Muat ulang berkala hanya saat halaman terlihat.
  const loop = () => { clearInterval(timer); if (document.visibilityState === 'visible') timer = setInterval(load, 60000); };
  document.addEventListener('visibilitychange', () => { loop(); if (document.visibilityState === 'visible') load(); });
  loop(); await load();
});
</script>
</body>
</html>
