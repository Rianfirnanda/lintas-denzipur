<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if (top === self) location.replace('admin.html#rekap');</script>
<title>Rekap</title>
<link rel="stylesheet" href="page-base.css">
<link rel="stylesheet" href="theme-light.css">
<script src="theme.js"></script>
</head>
<body>
<div class="page-header row"><div class="grow"><h1>Rekap</h1><p id="sub">Ringkasan agregat sesuai lingkup akses (tanpa koordinat).</p></div>
  <div class="acts"><button class="btn" id="ref">↻ Muat ulang</button><button class="btn ok" id="csv" disabled>Ekspor CSV</button></div></div>
<div id="state"></div>
<div class="panel"><h2>Kegiatan per status</h2><table><tbody id="tk"></tbody></table></div>
<div class="panel"><h2>Laporan per status</h2><table><tbody id="tl"></tbody></table></div>
<div class="panel"><h2>Tracking</h2><table><tbody id="tt"></tbody></table></div>
<div class="toast" id="toast"></div>
<script type="module">
import { guard, $, esc, dz, LABEL, fmtTime, errText, ready, stateBox, downloadCsv } from './common.js';
guard(async (ctx) => {
  let d = null;
  const NA = 'tidak tersedia untuk peran ini';
  const rows = (obj, lab) => !obj ? `<tr><td class="muted">${NA}</td><td></td></tr>` : Object.entries(obj).map(([k, v]) => `<tr><td>${esc(lab[k] || k)}</td><td style="text-align:right"><b>${v}</b></td></tr>`).join('');
  async function load() {
    stateBox($('state'), 'loading', 'Memuat rekap…');
    try {
      d = await dz.dashboard(ctx);
      if (d.empty) return stateBox($('state'), 'empty', 'Akun belum memiliki lingkup unit.');
      $('state').innerHTML = '';
      $('sub').textContent = `Diperbarui ${fmtTime(d.generatedAtMs, { seconds: true })} · ${d.scope ? d.scope.length + ' unit' : 'semua unit'}`;
      $('tk').innerHTML = rows(d.kegiatan, LABEL.kegiatan);
      $('tl').innerHTML = rows(d.laporan, LABEL.laporan);
      $('tt').innerHTML = `<tr><td>Personel aktif</td><td style="text-align:right"><b>${d.personelAktif ?? NA}</b></td></tr><tr><td>Sesi tracking aktif</td><td style="text-align:right"><b>${d.sesiAktif ?? NA}</b></td></tr>
        <tr><td>Lokasi belum diperbarui (&gt; ${d.staleMinutes} mnt)</td><td style="text-align:right"><b>${d.lokasiBelumDiperbarui ?? NA}</b></td></tr>`;
      $('csv').disabled = false;
    } catch (e) { stateBox($('state'), 'err', 'Gagal memuat rekap: ' + errText(e), load); }
    ready();
  }
  $('ref').onclick = load;
  $('csv').onclick = () => d && downloadCsv('rekap-denzipur.csv', [['Kategori', 'Status', 'Jumlah'],
    ...Object.entries(d.kegiatan || {}).map(([k, v]) => ['Kegiatan', LABEL.kegiatan[k], v]),
    ...Object.entries(d.laporan || {}).map(([k, v]) => ['Laporan', LABEL.laporan[k], v]),
    ['Personel', 'Aktif', d.personelAktif], ['Tracking', 'Sesi aktif', d.sesiAktif], ['Dibuat', fmtTime(d.generatedAtMs), '']]);
  load();
});
</script>
</body>
</html>
