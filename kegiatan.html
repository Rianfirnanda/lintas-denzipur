<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if (top === self) location.replace('admin.html#kegiatan');</script>
<title>Manajemen Kegiatan</title>
<link rel="stylesheet" href="page-base.css">
<link rel="stylesheet" href="theme-light.css">
<script src="theme.js"></script>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script type="module">
import { crud } from './common.js';
crud({
  col: 'lintas_kegiatan', title: 'Manajemen Kegiatan', desc: 'Catat dan kelola kegiatan.',
  fields: [
    { k: 'judul', label: 'Nama Kegiatan', req: true },
    { k: 'tanggal', label: 'Tanggal', type: 'date', req: true },
    { k: 'lokasi', label: 'Lokasi' },
    { k: 'status', label: 'Status', type: 'select', opts: ['Rencana', 'Berjalan', 'Selesai'] },
    { k: 'catatan', label: 'Catatan', type: 'textarea' }
  ],
  cols: ['tanggal', 'judul', 'lokasi', 'status', 'catatan']
});
</script>
</body>
</html>
