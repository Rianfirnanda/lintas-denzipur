<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if (top === self) location.replace('admin.html#tracking');</script>
<title>Tracking</title>
<link rel="stylesheet" href="page-base.css">
<link rel="stylesheet" href="theme-light.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="theme.js"></script>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script type="module">
import { guard, $, esc, toast, db, F } from './common.js';

guard(() => {
  $('root').innerHTML = `
    <div class="page-header"><h1>Tracking</h1><p>Lokasi user dari tiap kegiatan + posisi manual unit/personel.</p></div>
    <div class="panel">
      <div class="form" style="margin-bottom:16px">
        <label>Rentang
          <select id="rng"><option value="1">1 jam</option><option value="6">6 jam</option><option value="24" selected>24 jam terakhir</option></select>
        </label>
        <label>User<select id="usr"><option value="">Semua</option></select></label>
        <label>Titik manual<select id="man"><option value="1">Tampilkan</option><option value="0">Sembunyikan</option></select></label>
        <label>&nbsp;<button class="btn ok" id="ref">Refresh</button></label>
      </div>
      <div id="map" style="height:420px;border-radius:10px;margin-bottom:16px"></div>
      <div id="info" style="color:var(--muted);margin-bottom:8px"></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Waktu</th><th>User</th><th>Kegiatan</th><th>Lokasi</th><th>Aksi</th></tr></thead>
        <tbody id="rows"></tbody></table></div>
    </div>`;

  const map = L.map('map').setView([-3.77, 102.39], 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  const layer = L.layerGroup().addTo(map);

  let keg = [], manual = [];
  const t = ms => ms ? new Date(ms).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
  const ms = d => d.createdAt || d.createdAtServer?.seconds * 1000 || d.tanggalMillis || 0;
  const gmaps = (lat, lng) => `https://www.google.com/maps?q=${lat},${lng}`;
  const valid = d => Number.isFinite(+d.lat) && Number.isFinite(+d.lng);

  const draw = () => {
    layer.clearLayers();
    const u = $('usr').value;
    const list = keg.filter(d => valid(d) && (!u || d.userId === u)).sort((a, b) => ms(b) - ms(a));
    const pts = [];

    list.forEach(d => {
      pts.push([+d.lat, +d.lng]);
      L.circleMarker([+d.lat, +d.lng], { radius: 8, color: '#1d4ed8', fillColor: '#3b82f6', fillOpacity: .85 })
        .bindPopup(`<b>${esc(d.userName || d.userEmail || '-')}</b><br>${esc(d.judul || '')}<br>
          <small>${t(ms(d))}</small><br><small>${esc(d.alamat || '')}</small>
          ${d.fotoUrl ? `<br><a href="${esc(d.fotoUrl)}" target="_blank" rel="noopener">Lihat foto</a>` : ''}`)
        .addTo(layer);
    });

    if ($('man').value === '1' && !u) {
      manual.filter(valid).forEach(d => {
        pts.push([+d.lat, +d.lng]);
        L.circleMarker([+d.lat, +d.lng], { radius: 8, color: '#c2410c', fillColor: '#fb923c', fillOpacity: .85 })
          .bindPopup(`<b>${esc(d.nama || '-')}</b><br>${esc(d.keterangan || '')}<br><small>(manual)</small>`)
          .addTo(layer);
      });
    }
    if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 16 });

    $('info').textContent = `${list.length} titik kegiatan` + (u ? '' : ` · ${manual.length} titik manual`);
    $('rows').innerHTML = list.map(d => `<tr>
      <td>${t(ms(d))}</td>
      <td><b>${esc(d.userName || '(tanpa nama)')}</b><br><small style="color:var(--muted)">${esc(d.userEmail || '')}</small></td>
      <td>${esc(d.judul || '-')}<br><small style="color:var(--muted)">${esc(d.catatan || '')}</small></td>
      <td><small>${esc(d.alamat || d.lokasi || '-')}</small><br><small style="color:var(--muted)">${(+d.lat).toFixed(5)}, ${(+d.lng).toFixed(5)}</small></td>
      <td><div class="acts">
        <button class="btn ok" data-f="${+d.lat},${+d.lng}">Fokus</button>
        <a class="btn" href="${gmaps(d.lat, d.lng)}" target="_blank" rel="noopener">Maps</a>
        ${d.fotoUrl ? `<a class="btn" href="${esc(d.fotoUrl)}" target="_blank" rel="noopener">Foto</a>` : ''}
      </div></td></tr>`).join('') || '<tr><td colspan="5" class="empty">Belum ada kegiatan di rentang ini.</td></tr>';
  };

  const fillUsers = () => {
    const cur = $('usr').value, seen = new Map();
    keg.forEach(d => d.userId && seen.set(d.userId, d.userName || d.userEmail || d.userId));
    $('usr').innerHTML = '<option value="">Semua</option>' +
      [...seen].map(([id, n]) => `<option value="${esc(id)}">${esc(n)}</option>`).join('');
    $('usr').value = seen.has(cur) ? cur : '';
  };

  // One-time fetch (bukan onSnapshot) biar read hemat; filter waktu di server
  const load = async () => {
    const since = Date.now() - (+$('rng').value) * 3600 * 1000;
    try {
      const [a, b] = await Promise.all([
        F.getDocs(F.query(F.collection(db, 'lintas_kegiatan'), F.where('createdAt', '>=', since))),
        F.getDocs(F.collection(db, 'lintas_tracking'))
      ]);
      keg = a.docs.map(d => ({ id: d.id, ...d.data() }));
      manual = b.docs.map(d => ({ id: d.id, ...d.data() }));
      fillUsers(); draw();
    } catch (err) { toast('Gagal load: ' + (err.code || err.message), 'err'); }
  };

  $('rng').onchange = load; $('ref').onclick = load;
  $('usr').onchange = draw; $('man').onchange = draw;
  $('rows').onclick = e => {
    const b = e.target.closest('button[data-f]'); if (!b) return;
    const [lat, lng] = b.dataset.f.split(',').map(Number);
    map.setView([lat, lng], 17);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  load();
  setInterval(load, 120000); // auto refresh tiap 2 menit
});
</script>
</body>
</html>
