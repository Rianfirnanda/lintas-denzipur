<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="https://firebasestorage.googleapis.com/v0/b/lintas-benteng.firebasestorage.app/o/assets%2Fdenzipur%2014%20logo.png?alt=media&token=dc433442-00dd-40d5-93b1-a2529c9813b0">
<script>if (top === self) location.replace('admin.html#admin-manager');</script>
<link rel="stylesheet" href="theme-light.css">
<script src="theme.js"></script>
<title>Admin Management — Lintas Denzipur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
<style>
:root{--bg:#0a0a0a;--border:rgba(255,255,255,.1);--blue:#3b82f6;--purple:#8b5cf6;--teal:#06b6d4;--green:#22c55e;--orange:#f59e0b;--red:#ef5350;--text:#e5e5e5;--muted:#a0a0a0;--sidebar-w:260px;--ease:cubic-bezier(.22,1,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:none}}

#splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:999}
#splash i{width:28px;height:28px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
#app{display:none;min-height:100vh}
#app.show{display:flex}

/* sidebar */
.sidebar{width:var(--sidebar-w);background:rgba(10,10,10,.98);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:200;transition:transform .3s ease;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sidebar-logo{padding:24px 24px 20px;border-bottom:1px solid var(--border);text-align:center}
.logo-pair{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.logo-pair img{width:auto;object-fit:contain}.logo-pair .l1{height:34px}.logo-pair .l2{height:48px}.logo-pair span{color:var(--muted);font-size:12px}
.s-title{font-size:13px;font-weight:800;letter-spacing:.12em;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.s-badge{display:block;margin-top:4px;font-size:10px;font-weight:600;letter-spacing:.12em;color:#555;text-transform:uppercase}
.sidebar-user{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.user-meta{min-width:0}.user-meta small{display:block;font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.user-meta span{display:block;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-nav{flex:1;padding:16px 12px}
.nav-label{font-size:9px;font-weight:700;letter-spacing:.15em;color:#555;text-transform:uppercase;padding:8px 12px 6px;margin-top:8px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;transition:all .2s;margin-bottom:2px;border:1px solid transparent}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
.nav-item.active{color:var(--blue);background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.2)}
.nav-item svg{width:16px;height:16px;flex-shrink:0;stroke-width:1.8}
.sidebar-footer{padding:16px 12px;border-top:1px solid var(--border)}
.logout-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(239,83,80,.2);background:rgba(239,83,80,.05);color:#f87171;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit}
.logout-btn:hover{background:rgba(239,83,80,.15);border-color:rgba(239,83,80,.4)}
.logout-btn svg{width:16px;height:16px;stroke-width:1.8}

/* topbar + main */
.topbar{position:fixed;top:0;left:var(--sidebar-w);right:0;height:64px;background:rgba(10,10,10,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:100}
.topbar-left{display:flex;align-items:center;gap:12px}
.hamburger{display:none;background:none;border:none;cursor:pointer;color:var(--muted);padding:4px}.hamburger svg{width:20px;height:20px}
.breadcrumb{font-size:13px;color:var(--muted)}.breadcrumb span{color:var(--text);font-weight:600}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
.main{margin-left:0;padding-top:0;flex:1;min-width:0}
.content{padding:32px 28px}
.page-header{margin-bottom:24px;animation:fadeUp .7s var(--ease) backwards}
.page-header h1{font-size:30px;font-weight:700;letter-spacing:-.02em;color:#fff}
.page-header p{font-size:14px;color:var(--muted);margin-top:6px}

/* stat */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{position:relative;overflow:hidden;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:20px;animation:fadeUp .7s var(--ease) backwards}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-card.blue::after{background:var(--blue)}.stat-card.purple::after{background:var(--purple)}.stat-card.orange::after{background:var(--orange)}.stat-card.red::after{background:var(--red)}
.stat-value{font-size:30px;font-weight:700;color:#fff;line-height:1;margin-bottom:6px}
.stat-label{font-size:12px;color:var(--muted);font-weight:500}

/* panel */
.panel{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:20px;padding:24px;animation:fadeUp .7s var(--ease) .15s backwards}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04)}
.search svg{width:16px;height:16px;stroke:var(--muted)}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.tab:hover{color:var(--text);background:rgba(255,255,255,.05)}
.tab.active{color:var(--blue);background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.25)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:0 10px 12px}
td{padding:12px 10px;font-size:13px;border-top:1px solid rgba(255,255,255,.07);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
.u{display:flex;align-items:center;gap:12px;min-width:0}
.u .avatar{width:34px;height:34px;border-radius:9px;font-size:13px}
.u b{display:block;font-size:13px;font-weight:600;color:#fff}
.u small{display:block;font-size:11px;color:var(--muted);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.pill.admin{background:rgba(139,92,246,.15);color:var(--purple)}
.pill.user{background:rgba(255,255,255,.07);color:var(--muted)}
.pill.active{background:rgba(34,197,94,.12);color:var(--green)}
.pill.pending{background:rgba(245,158,11,.12);color:var(--orange)}
.pill.blocked{background:rgba(239,83,80,.12);color:var(--red)}
.pill.owner{background:rgba(59,130,246,.15);color:var(--blue)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:6px 11px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.ok{color:var(--green);border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.07)}
.btn.pr{color:var(--purple);border-color:rgba(139,92,246,.3);background:rgba(139,92,246,.07)}
.btn.wn{color:var(--orange);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.07)}
.btn.dg{color:#f87171;border-color:rgba(239,83,80,.3);background:rgba(239,83,80,.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;padding:36px 0;color:var(--muted);font-size:13px}
.lock{font-size:11px;color:#555}

.toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:12px;background:#151515;border:1px solid var(--border);font-size:13px;z-index:900;transform:translateY(20px);opacity:0;pointer-events:none;transition:all .35s var(--ease)}
.toast.show{transform:none;opacity:1}
.toast.err{border-color:rgba(239,83,80,.4);color:#f87171}
.toast.ok{border-color:rgba(34,197,94,.4);color:var(--green)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150}

@media(max-width:1100px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.topbar{left:0}.hamburger{display:flex}.content{padding:20px 16px}.panel{padding:16px}}
@media(max-width:480px){.stat-grid{grid-template-columns:1fr 1fr}.page-header h1{font-size:24px}}
</style>
</head>
<body>


<div id="app" class="show">
    

  

  <main class="main"><div class="content">
    <div class="page-header">
      <h1>Admin Management</h1>
      <p>Atur siapa yang boleh masuk dan siapa yang jadi admin Lintas Denzipur.</p>
    </div>

    <div class="stat-grid">
      <div class="stat-card blue"><div class="stat-value" id="stTotal">0</div><div class="stat-label">Total Akun</div></div>
      <div class="stat-card purple"><div class="stat-value" id="stAdmin">0</div><div class="stat-label">Admin</div></div>
      <div class="stat-card orange"><div class="stat-value" id="stPending">0</div><div class="stat-label">Menunggu Persetujuan</div></div>
      <div class="stat-card red"><div class="stat-value" id="stBlocked">0</div><div class="stat-label">Diblokir</div></div>
    </div>

    <div class="panel" style="margin-bottom:16px">
  <form id="inviteForm" class="toolbar" style="margin-bottom:12px">
    <div class="search"><i data-feather="mail"></i><input id="invEmail" type="email" placeholder="Email yang diundang (xxx@gmail.com)" required></div>
    <select id="invRole" class="tab"><option value="admin">Admin</option><option value="user">User</option></select>
    <button class="btn ok" type="submit">Tambah via Email</button>
  </form>
  <div id="invList" class="acts"></div>
</div>

    <div class="panel">
      <div class="toolbar">
        <div class="search"><i data-feather="search"></i><input id="q" placeholder="Cari nama atau email..."></div>
        <div class="tabs" id="tabs">
          <button class="tab active" data-f="all">Semua</button>
          <button class="tab" data-f="pending">Pending</button>
          <button class="tab" data-f="admin">Admin</button>
          <button class="tab" data-f="user">User</button>
          <button class="tab" data-f="blocked">Diblokir</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Akun</th><th>Role</th><th>Status</th><th>Terakhir Login</th><th>Aksi</th></tr></thead>
          <tbody id="rows"><tr><td colspan="5" class="empty">Memuat data...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div></main>
</div>

<div class="toast" id="toast"></div>


<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, onSnapshot, updateDoc, deleteDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyAlVfejf312G-tIleA8izbxn98bDGe1MvM",
  authDomain: "lintas-benteng.firebaseapp.com",
  databaseURL: "https://lintas-benteng-default-rtdb.firebaseio.com",
  projectId: "lintas-benteng",
  storageBucket: "lintas-benteng.firebasestorage.app",
  messagingSenderId: "1005929757785",
  appId: "1:1005929757785:web:65b6d25b390677a98f0548",
  measurementId: "G-647RZ20J14"
};

// ⚙️ CONFIG
const COLLECTION   = 'lintas';
const OWNER_EMAILS = ['sutannadhif@gmail.com'];
const HOME_URL     = 'admin.html';   // halaman login+dashboard

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);

let me = null, allUsers = [], filter = 'all', started = false;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isOwnerEmail = (e) => OWNER_EMAILS.includes(e);

function toast(msg, type = 'ok') {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', 2800);
}
function fmt(ts) {
  if (!ts) return '-';
  const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
  return d.toLocaleString('id-ID', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

/* ───── Guard ───── */
onAuthStateChanged(auth, async (user) => {
  if (!user) { top.location.href = HOME_URL; return; }
  try {
    let data;
    if (isOwnerEmail(user.email)) {
      data = { role:'admin', status:'active', photoURL:user.photoURL };
    } else {
      const snap = await getDoc(doc(db, COLLECTION, user.uid));
      data = snap.exists() ? snap.data() : null;
      if (!data || data.role !== 'admin' || data.status !== 'active') {
        alert('⛔ Akses ditolak. Halaman ini khusus admin.');
        top.location.href = HOME_URL; return;
      }
    }
    me = user;

    $('app').classList.add('show');
    feather.replace();
    if (!started) { started = true; listen(); }
  } catch (e) {
    console.error(e);
    alert('Gagal memuat: ' + (e.code || e.message));
  }
});

/* ───── Data realtime ───── */
function listen() {
    onSnapshot(collection(db, COLLECTION), (snap) => {
    allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
    window.__ready && window.__ready();
  }, (e) => {
    console.error(e);
    $('rows').innerHTML = `<tr><td colspan="5" class="empty">Gagal memuat: ${esc(e.code || e.message)}<br><small>Cek Firestore rules untuk collection lintas.</small></td></tr>`;
    window.__ready && window.__ready();
  });
}

$('inviteForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('invEmail').value.trim().toLowerCase();
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast('Email tidak valid.', 'err');
  try {
    await setDoc(doc(db, 'lintas_invites', email), { email, role: $('invRole').value, by: me.email, createdAt: serverTimestamp() });
    toast('Undangan disimpan. Tinggal login dengan Google.');
    e.target.reset();
  } catch (err) { toast('Gagal: ' + (err.code || err.message), 'err'); }
});
$('invList').addEventListener('click', async (e) => {
  const a = e.target.closest('[data-del]'); if (!a) return;
  e.preventDefault();
  await deleteDoc(doc(db, 'lintas_invites', a.dataset.del)).catch(err => toast('Gagal: ' + err.code, 'err'));
});

function render() {
  const q = $('q').value.trim().toLowerCase();

  $('stTotal').textContent   = allUsers.length;
  $('stAdmin').textContent   = allUsers.filter(u => u.role === 'admin').length;
  $('stPending').textContent = allUsers.filter(u => (u.status || 'pending') === 'pending').length;
  $('stBlocked').textContent = allUsers.filter(u => u.status === 'blocked').length;

  const list = allUsers
    .filter(u => {
      const st = u.status || 'pending';
      if (filter === 'pending' && st !== 'pending') return false;
      if (filter === 'blocked' && st !== 'blocked') return false;
      if (filter === 'admin'   && u.role !== 'admin') return false;
      if (filter === 'user'    && u.role === 'admin') return false;
      if (q && !((u.email || '').toLowerCase().includes(q) || (u.displayName || '').toLowerCase().includes(q))) return false;
      return true;
    })
    .sort((a, b) => {
      // owner dulu, lalu admin, lalu pending, lalu sisanya by login terakhir
      const rank = (u) => isOwnerEmail(u.email) ? 0 : u.role === 'admin' ? 1 : (u.status === 'pending' ? 2 : 3);
      const r = rank(a) - rank(b);
      if (r) return r;
      return (b.lastLogin?.seconds || 0) - (a.lastLogin?.seconds || 0);
    });

  if (!list.length) {
    $('rows').innerHTML = '<tr><td colspan="5" class="empty">Tidak ada akun yang cocok.</td></tr>';
    return;
  }

  $('rows').innerHTML = list.map(u => {
    const owner = isOwnerEmail(u.email);
    const self  = me && u.id === me.uid;
    const st    = u.status || 'pending';
    const role  = u.role || 'user';
    const init  = (u.email || '?')[0].toUpperCase();
    const av    = u.photoURL ? `<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">` : init;

    let acts = '';
    if (owner) acts = '<span class="lock">🔒 Owner (terkunci)</span>';
    else if (self) acts = '<span class="lock">Akun kamu sendiri</span>';
    else {
      if (st === 'pending')  acts += `<button class="btn ok" data-a="approve" data-id="${u.id}">Setujui</button>`;
      if (st === 'blocked')  acts += `<button class="btn ok" data-a="unblock" data-id="${u.id}">Buka Blokir</button>`;
      if (role !== 'admin')  acts += `<button class="btn pr" data-a="makeadmin" data-id="${u.id}">Jadikan Admin</button>`;
      else                   acts += `<button class="btn wn" data-a="revoke" data-id="${u.id}">Cabut Admin</button>`;
      if (st !== 'blocked')  acts += `<button class="btn wn" data-a="block" data-id="${u.id}">Blokir</button>`;
      acts += `<button class="btn dg" data-a="delete" data-id="${u.id}">Hapus</button>`;
    }

    return `<tr>
      <td><div class="u"><div class="avatar">${av}</div><div style="min-width:0"><b>${esc(u.displayName || '(tanpa nama)')}</b><small>${esc(u.email || '-')}</small></div></div></td>
      <td>${owner ? '<span class="pill owner">Owner</span>' : `<span class="pill ${role === 'admin' ? 'admin' : 'user'}">${role === 'admin' ? 'Admin' : 'User'}</span>`}</td>
      <td><span class="pill ${st}">${st === 'active' ? 'Aktif' : st === 'blocked' ? 'Diblokir' : 'Pending'}</span></td>
      <td style="color:var(--muted);font-size:12px">${fmt(u.lastLogin)}</td>
      <td><div class="acts">${acts}</div></td>
    </tr>`;
  }).join('');
}

/* ───── Aksi ───── */
const ACTIONS = {
  approve:   { patch: { status:'active' },                  msg:'Akun disetujui.' },
  unblock:   { patch: { status:'active' },                  msg:'Blokir dibuka.' },
  block:     { patch: { status:'blocked' },                 msg:'Akun diblokir.',      ask:'Blokir akun ini?' },
  makeadmin: { patch: { role:'admin', status:'active' },    msg:'Akun dijadikan admin.', ask:'Jadikan akun ini admin? Dia bisa mengelola semua akun.' },
  revoke:    { patch: { role:'user' },                      msg:'Akses admin dicabut.', ask:'Cabut akses admin akun ini?' },
  delete:    { del: true,                                    msg:'Akun dihapus.',       ask:'Hapus akun ini? Kalau dia login lagi, akan terdaftar ulang sebagai pending.' }
};

$('rows').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-a]');
  if (!btn) return;
  const act = ACTIONS[btn.dataset.a];
  const target = allUsers.find(u => u.id === btn.dataset.id);
  if (!act || !target) return;

  // pengaman tambahan di sisi klien
  if (isOwnerEmail(target.email) || target.id === me.uid) { toast('Akun ini tidak bisa diubah.', 'err'); return; }
  if (act.ask && !confirm(`${act.ask}\n\n${target.email}`)) return;

  btn.disabled = true;
  try {
    if (act.del) await deleteDoc(doc(db, COLLECTION, target.id));
    else await updateDoc(doc(db, COLLECTION, target.id), act.patch);
    toast(act.msg);
  } catch (err) {
    console.error(err);
    toast('Gagal: ' + (err.code || err.message), 'err');
    btn.disabled = false;
  }
});

/* ───── Filter & cari ───── */
$('q').addEventListener('input', render);
$('tabs').addEventListener('click', (e) => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active'); filter = t.dataset.f; render();
});


</script>
